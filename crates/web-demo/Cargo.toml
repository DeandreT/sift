[package]
name = "sift-web-demo"
description = "Browser demo for sift using the real egui views and an in-memory Service Bus simulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
egui.workspace = true
egui_dock.workspace = true
sift-ui = { path = "../sift", package = "sift" }
sift-backend.workspace = true
sift-core.workspace = true
sift-mgmt.workspace = true
time.workspace = true
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[lints]
workspace = true
