name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: sift
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: sift.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dri libegl1 libvulkan1 mesa-vulkan-drivers xvfb xauth x11-utils
      - uses: actions-rust-lang/setup-rust-toolchain@ac90e63697ac2784f4ecfe2964e1a285c304003a # v1.14.1
        with:
          cache: true
      - name: Check release source
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Build desktop binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p sift --target "$BUILD_TARGET"
      - name: Package versioned binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_args=()
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag_args=(--tag "$REF_NAME")
          fi
          python scripts/package-release.py --binary "target/$BUILD_TARGET/release/$BINARY_NAME" --target "$BUILD_TARGET" "${tag_args[@]}"
      - name: Verify distributed Linux binary
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a python scripts/smoke-release.py target/release-artifacts/*.tar.gz 2>&1 | tee packaged-smoke.log
      - name: Verify distributed Windows binary
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          python scripts/smoke-release.py target/release-artifacts/*.zip 2>&1 | tee packaged-smoke.log
      - name: Record packaged startup failure diagnostics
        if: failure()
        run: |
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          path = Path("packaged-smoke.log")
          if path.exists():
              with path.open("rb") as log:
                  log.seek(max(0, path.stat().st_size - 16384))
                  tail = log.read().decode("utf-8", errors="replace")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("### Packaged startup failure diagnostics (last 16 KiB)\n\n<pre>")
                  summary.write(html.escape(tail))
                  summary.write("</pre>\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sift-${{ matrix.target }}
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Draft tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sift-*
          merge-multiple: true
          path: artifacts
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft > is-draft.txt; then
            if [[ "$(cat is-draft.txt)" != "true" ]]; then
              echo "Refusing to replace artifacts on an already published release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" artifacts/* --repo "$REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --notes-file docs/release-notes.md
          else
            gh release create "$RELEASE_TAG" artifacts/* --repo "$REPOSITORY" --verify-tag --draft --prerelease --title "Sift $RELEASE_TAG preview" --notes-file docs/release-notes.md
          fi
